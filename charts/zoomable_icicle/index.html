<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoomable Icicle Chart - Lebanese Elections 2022</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="container">
        <div class="inner-content">
            <div class="header">
                <div class="header-row">
                    <h1 class="main-title">الإنتخابات اللبنانية 2022</h1>
                    <div class="search-container">
                        <input type="text" id="searchInput" class="search-input" placeholder="البحث">
                        <button id="searchBtn" class="search-btn hidden">
                            <svg width="24" height="24" viewBox="0 0 32 32" fill="none">
                                <circle cx="15" cy="15" r="9" stroke="currentColor" stroke-width="2" fill="none" />
                                <line x1="23" y1="23" x2="29" y2="29" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" />
                            </svg>
                        </button>
                        <button id="clearBtn" class="clear-btn hidden">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                                <path d="M12 4L4 12M4 4L12 12" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
            <div id="chart-container"></div>
            <!-- Legend List -->
            <div class="legend-list">
                <div class="legend-item">
                    <span class="legend-circle" style="background:#85c980"></span>
                    <span class="legend-label">شيعة</span>
                    <span class="legend-percent" id="legend-percent-shia">0%</span>
                </div>
                <div class="legend-item">
                    <span class="legend-circle" style="background:#8380c9"></span>
                    <span class="legend-label">سني</span>
                    <span class="legend-percent" id="legend-percent-sunni">0%</span>
                </div>
                <div class="legend-item">
                    <span class="legend-circle" style="background:#c98080"></span>
                    <span class="legend-label">مسيحي</span>
                    <span class="legend-percent" id="legend-percent-christian">0%</span>
                </div>
                <div class="legend-item">
                    <span class="legend-circle" style="background:#bc80c9"></span>
                    <span class="legend-label">دروز</span>
                    <span class="legend-percent" id="legend-percent-druz">0%</span>
                </div>
                <div class="legend-item">
                    <span class="legend-circle" style="background:#c8c8c8"></span>
                    <span class="legend-label">أخرى</span>
                    <span class="legend-percent" id="legend-percent-others">0%</span>
                </div>
            </div>
        </div>
    </div>
    <script src="data/data.js"></script>
    <script src="js/coloring.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
