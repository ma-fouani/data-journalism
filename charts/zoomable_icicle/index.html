<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lebanon 2022 - Zoomable Icicle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="zoom_icicle_container">
        <div class="zoom_icicle_header">
            <h1 class="zoom_icicle_title">Lebanon 2022</h1>
            <p class="zoom_icicle_subtitle">Explore election results and political coalitions - Click to zoom in,
                click root to zoom out</p>
        </div>

        <div class="zoom_icicle_chart_wrapper">
            <div class="zoom_icicle_breadcrumb" id="breadcrumb"></div>
            <svg class="zoom_icicle_chart" id="chart"></svg>
            <div class="zoom_icicle_info" id="info">
                <div class="zoom_icicle_info_title" id="infoTitle"></div>
                <div class="zoom_icicle_info_count" id="infoCount"></div>
                <div class="zoom_icicle_info_source" id="infoSource"></div>
            </div>
        </div>
    </div>

    <script src="data/data.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
