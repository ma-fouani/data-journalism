<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Tour - Optimized</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://d3js.org/topojson.v3.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: white;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        .sphere {
            fill: #16213e;
            stroke: #0f3460;
            stroke-width: 1px;
        }

        .country {
            fill: #533483;
            stroke: #16213e;
            stroke-width: 0.25px;
        }

        .location-dot {
            fill: #e74c3c;
            stroke: white;
            stroke-width: 1px;
        }

        .location-dot.current {
            fill: #f39c12;
        }

        .route-line {
            fill: none;
            stroke: #f39c12;
            stroke-width: 2px;
            opacity: 0.8;
        }

        .info-panel {
            position: absolute;
            bottom: 16px;
            left: 20px;
            width: 700px;
            height: fit-content;
            /* 🧊 Frosted glass style */
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(4px) saturate(280%);
            -webkit-backdrop-filter: blur(4px) saturate(280%);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.25);

            /* ✨ Subtle shadow and depth */
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);

            overflow: hidden;
            display: flex;
            flex-direction: row;
            gap: 12px;
            padding: 16px;
            z-index: 30; 
            
            transition: transform 0.3s ease, opacity 0.3s ease;
            transform: translateY(100%);
            opacity: 0;
        }

        .info-panel.slide-down {
            transition: transform .3s ease, opacity 0.3s ease!important;
            transform: translateY(100%)!important;
            opacity: 0!important;
        }

        .info-panel.slide-up {
            transform: translateY(0);
            opacity: 1;
        }

        /* Fixed-height image in the card */
        #location-image {
            transform-origin: bottom center;
            width: 100%;
            height: 200px;
            flex: 0 0 120px;
            object-fit: cover;
            border-radius: 10px;
            background: #ddd;
            display: none;
        }

        #location-text {
            flex: 1 1 auto;
            min-width: 0;
            /* important for truncation */
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .info-panel h3 {
            margin: 0;
            font-size: 1.1rem;
            line-height: 1.3;
            font-weight: 700;
            color: #fff;
            display: -webkit-box;
            /*-webkit-line-clamp: 3;
            line-clamp: 3;*/
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .date {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        #location-description {
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.85);
            display: -webkit-box;
            /*-webkit-line-clamp: 6;
            line-clamp: 6;*/
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Loading bar styling */
        .loading-bar-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 0 0 16px 16px;
            overflow: hidden;
        }

        .loading-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff6b3d, #d38642);
            border-radius: 0 0 16px 16px;
            transition: width 0.1s ease-out;
            box-shadow: 0 0 8px rgba(255, 107, 61, 0.6);
        }

        @media (min-width: 800px) {
            #container {
                overflow-x: auto;
                overflow-y: hidden;
                justify-content: center;
            }

            .info-panel {
                right: 20px;
                left: auto;
            }
        }

        @media (max-width: 800px) {
            #container {
                overflow-x: auto;
                overflow-y: hidden;
            }

            .info-panel {
                width: 85%;
                max-width: 400px;
                bottom: 10px;
                left: 50%;
                transform: translateX(-50%) translateY(100%);
                margin: 10px;
                flex-direction: column;
            }

            .info-panel.slide-up {
                transform: translateX(-50%) translateY(0);
            }

            .info-panel.slide-down {
                transform: translateX(-50%) translateY(100%)!important;
            }

            /* Place image as full-width block on small screens if needed */
            #location-image {
                width: 100%;
                height: fit-content;
                object-fit: cover;
                aspect-ratio: 1.7;
                border-radius: 8px;
                margin-bottom: 8px;
            }

            #location-text {
                padding: 0 4px;
            }
        }

        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            /* 🧊 Frosted glass style */
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(4px) saturate(280%);
            -webkit-backdrop-filter: blur(4px) saturate(280%);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            padding: 8px;
            z-index: 40;
        }

        .btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            min-width: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.5);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn:disabled:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: none;
            box-shadow: none;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 2px;
            background: #f39c12;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="progress-bar"></div>
        
        <div class="info-panel">
            <img id="location-image" alt="Location image" />
            <div id="location-text">
                <h3 id="location-title">Loading...</h3>
                <div class="date" id="location-date"></div>
                <div id="location-description"></div>
            </div>
            <div class="loading-bar-container">
                <div class="loading-bar"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn" id="prev-btn">←</button>
            <button class="btn" id="play-btn">⏸</button>
            <button class="btn" id="next-btn">→</button>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        // Optimized global variables
        const zoomFactor = 70;
        let currentLocationIndex = 0;
        let isPlaying = true; // Auto-play enabled by default
        let playInterval;

        const width = window.innerWidth;
        const height = window.innerHeight;
        const duration = 1500; // Reduced duration

        // Simplified projection - start at very far zoom
        const projection = d3.geoOrthographic()
            .scale(50) // Start at very small scale (far away)
            .translate([width / 2, height / 2])
            .rotate([0, 0]) // Start at default rotation
            .clipAngle(90);

        const path = d3.geoPath().projection(projection);

        // Create SVG with optimizations
        const svg = d3.select("#container")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        // Sphere
        const sphere = svg.append("path")
            .datum({type: "Sphere"})
            .attr("class", "sphere")
            .attr("d", path);

        // Store global references
        let countryPaths, dots, routeLines;

        // Load simplified world data
        d3.json("https://unpkg.com/world-atlas@2.0.2/countries-110m.json").then(function(world) {
            const countries = topojson.feature(world, world.objects.countries);
            
            // Add countries with minimal styling
            countryPaths = svg.selectAll(".country")
                .data(countries.features)
                .enter().append("path")
                .attr("class", "country")
                .attr("d", path);

            // Create route lines (initially empty)
            routeLines = svg.append("g").attr("class", "route-lines");

            // Add location dots
            dots = svg.selectAll(".location-dot")
                .data(coords)
                .enter().append("circle")
                .attr("class", "location-dot")
                .attr("r", 3);

            // Initialize
            updateLocationInfo(coords[currentLocationIndex]);
            // Show the panel initially
            setTimeout(() => {
                document.querySelector('.info-panel').classList.add('slide-up');
            }, 100);
            
            rotateToLocation(coords[currentLocationIndex], 2000); // Initial zoom-in with 2s duration
            setupEventListeners();
            updateControls();
            updateProgressBar();
            
            // Start auto-play after initial zoom
            setTimeout(function() {
                document.getElementById('play-btn').textContent = '⏸';
                playInterval = setInterval(function() {
                    if (currentLocationIndex < coords.length - 1) {
                        nextLocation();
                    } else {
                        togglePlay();
                    }
                }, duration + 800);
            }, 2500); // Start auto-play 500ms after initial zoom completes
        });

        function createRoute(fromCoords, toCoords) {
            const interpolate = d3.geoInterpolate(fromCoords, toCoords);
            const points = d3.range(0, 1.01, 0.05).map(interpolate);
            
            return {
                type: "LineString",
                coordinates: points
            };
        }

        function rotateToLocation(location, animationDuration = duration) {
            const targetRotation = [-location.coords[0], -location.coords[1]];
            const targetScale = location.zoom * zoomFactor;
            
            if (animationDuration === 0) {
                // Instant positioning
                projection.rotate(targetRotation).scale(targetScale);
                updateAll();
                return;
            }

            // Clear any existing route line
            routeLines.selectAll(".route-line").remove();

            // Get current state
            const currentRotation = projection.rotate();
            const currentScale = projection.scale();

            // Create interpolators
            const interpolateRotation = d3.interpolate(currentRotation, targetRotation);
            const interpolateScale = d3.interpolate(currentScale, targetScale);

            // Create animated route line if not the first location
            let routePath = null;
            if (currentLocationIndex > 0) {
                const currentLocation = coords[currentLocationIndex];
                const prevLocation = coords[currentLocationIndex - 1];
                
                routePath = routeLines.append("path")
                    .attr("class", "route-line")
                    .style("opacity", 0.8);
            }

            // Single transition for everything
            svg.transition("main")
                .duration(animationDuration)
                .ease(d3.easeCubicInOut)
                .tween("transform", function() {
                    return function(t) {
                        projection
                            .rotate(interpolateRotation(t))
                            .scale(interpolateScale(t));
                        
                        // Update static elements
                        updateAll();
                        
                        // Update animated route line
                        if (routePath && currentLocationIndex > 0) {
                            const currentLocation = coords[currentLocationIndex];
                            const prevLocation = coords[currentLocationIndex - 1];
                            
                            let routeData;
                            if (t < 0.8) {
                                // Growing phase: line grows from source to destination
                                const growProgress = t / 0.8;
                                const interpolate = d3.geoInterpolate(prevLocation.coords, currentLocation.coords);
                                const endPoint = interpolate(growProgress);
                                
                                routeData = {
                                    type: "LineString",
                                    coordinates: [prevLocation.coords, endPoint]
                                };
                            } else {
                                // Shrinking phase: line shrinks from source end
                                const shrinkProgress = (t - 0.8) / 0.2;
                                const interpolate = d3.geoInterpolate(prevLocation.coords, currentLocation.coords);
                                const startPoint = interpolate(shrinkProgress);
                                
                                routeData = {
                                    type: "LineString",
                                    coordinates: [startPoint, currentLocation.coords]
                                };
                            }
                            
                            routePath.datum(routeData).attr("d", path);
                        }
                    };
                })
                .on("end", function() {
                    // Remove the route line completely after animation
                    if (routePath) {
                        routePath.remove();
                    }
                });
        }

        function updateAll() {
            // Update all paths in one go
            sphere.attr("d", path);
            countryPaths.attr("d", path);
            
            // Update existing route lines
            routeLines.selectAll(".route-line").attr("d", path);
            
            // Update dots efficiently
            dots
                .attr("cx", function(d) {
                    const pos = projection(d.coords);
                    return pos ? pos[0] : -1000;
                })
                .attr("cy", function(d) {
                    const pos = projection(d.coords);
                    return pos ? pos[1] : -1000;
                })
                .style("opacity", function(d, i) {
                    const pos = projection(d.coords);
                    const visible = pos && pos[0] >= 0 && pos[0] <= width && pos[1] >= 0 && pos[1] <= height;
                    return visible ? (i === currentLocationIndex ? 1 : 0.6) : 0;
                })
                .attr("r", function(d, i) {
                    return i === currentLocationIndex ? 5 : 3;
                })
                .classed("current", function(d, i) {
                    return i === currentLocationIndex;
                });
        }

        function updateLocationInfo(location) {
            const panel = document.querySelector('.info-panel');
            
            // Slide down animation
            panel.classList.remove('slide-up');
            panel.classList.add('slide-down');
            
            setTimeout(() => {
                // Update content
                document.getElementById('location-title').textContent = location.news.title || location.name;
                document.getElementById('location-date').textContent = location.news.date || '';
                document.getElementById('location-description').textContent = location.news.description || '';
                
                // Handle image
                const imageEl = document.getElementById('location-image');
                if (location.news.image) {
                    imageEl.src = location.news.image;
                    imageEl.style.display = 'block';
                    imageEl.alt = location.news.title || location.name;
                } else {
                    imageEl.style.display = 'none';
                }
                
                // Slide up animation
                panel.classList.remove('slide-down');
                panel.classList.add('slide-up');
            }, 300);
        }

        function updateProgressBar() {
            const progress = ((currentLocationIndex + 1) / coords.length) * 100;
            document.querySelector('.progress-bar').style.width = progress + '%';
        }

        function updateControls() {
            document.getElementById('prev-btn').disabled = currentLocationIndex === 0;
            document.getElementById('next-btn').disabled = currentLocationIndex === coords.length - 1;
        }

        function nextLocation() {
            if (currentLocationIndex < coords.length - 1) {
                currentLocationIndex++;
                const location = coords[currentLocationIndex];
                rotateToLocation(location);
                updateLocationInfo(location);
                updateProgressBar();
                updateControls();
            }
        }

        function previousLocation() {
            if (currentLocationIndex > 0) {
                currentLocationIndex--;
                const location = coords[currentLocationIndex];
                rotateToLocation(location);
                updateLocationInfo(location);
                updateProgressBar();
                updateControls();
            }
        }

        function togglePlay() {
            const playBtn = document.getElementById('play-btn');
            
            if (isPlaying) {
                clearInterval(playInterval);
                isPlaying = false;
                playBtn.textContent = '▶';
            } else {
                isPlaying = true;
                playBtn.textContent = '⏸';
                
                playInterval = setInterval(function() {
                    if (currentLocationIndex < coords.length - 1) {
                        nextLocation();
                    } else {
                        togglePlay();
                    }
                }, duration + 800); // Extra time for route animation
            }
        }

        function setupEventListeners() {
            document.getElementById('prev-btn').addEventListener('click', previousLocation);
            document.getElementById('next-btn').addEventListener('click', nextLocation);
            document.getElementById('play-btn').addEventListener('click', togglePlay);

            // Touch-friendly keyboard controls
            document.addEventListener('keydown', function(event) {
                if (event.code === 'ArrowLeft') previousLocation();
                if (event.code === 'ArrowRight') nextLocation();
                if (event.code === 'Space') {
                    event.preventDefault();
                    togglePlay();
                }
            });
        }

        // Optimized resize handler
        let resizeTimeout;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(function() {
                const newWidth = window.innerWidth;
                const newHeight = window.innerHeight;
                
                svg.attr("width", newWidth).attr("height", newHeight);
                projection.translate([newWidth / 2, newHeight / 2]);
                updateAll();
            }, 100);
        });
    </script>
</body>
</html>
