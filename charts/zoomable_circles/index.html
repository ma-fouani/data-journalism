<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoomable Circles</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="chart"></div>
    <script src="data.js"></script>
    <script>
        const chart = (() => {
            // Specify the chart’s dimensions.
            const width = 928;
            const height = width;

            // Create the color scale.
            const color = d3.scaleLinear()
                .domain([0, 5])
                .range(["hsl(152,80%,80%)", "hsl(228,30%,40%)"])
                .interpolate(d3.interpolateHcl);

            // Compute the layout.
            const pack = data => d3.pack()
                .size([width, height])
                .padding(3)
                (d3.hierarchy(data)
                    .sum(d => d.value)
                    .sort((a, b) => b.value - a.value));
            const root = pack(data);

            // Create the SVG container.
            const svg = d3.create("svg")
                .attr("viewBox", `-${width / 2} -${height / 2} ${width} ${height}`)
                .attr("width", width)
                .attr("height", height)
                .attr("style", `max-width: 100%; height: auto; display: block; margin: 0 -14px; background: ${color(0)}; cursor: pointer;`);

            // Append the nodes.
            const node = svg.append("g")
                .selectAll("circle")
                .data(root.descendants().slice(1))
                .join("circle")
                .attr("fill", d => d.children ? color(d.depth) : "white")
                .attr("pointer-events", d => !d.children ? "none" : null)
                .on("mouseover", function () { d3.select(this).attr("stroke", "#000"); })
                .on("mouseout", function () { d3.select(this).attr("stroke", null); })
                .on("click", (event, d) => focus !== d && (zoom(event, d), event.stopPropagation()));

            // Append the text labels with backgrounds
            const label = svg.append("g")
                .attr("pointer-events", "none")
                .attr("text-anchor", "middle")
                .selectAll("g")
                .data(root.descendants())
                .join("g");

            // Add background rectangles
            label.append("rect")
                .attr("rx", 4)  // rounded corners
                .attr("ry", 4)
                .attr("fill", "white")
                .attr("fill-opacity", 0.3)  // 30% opacity
                .style("display", d => d.parent === root ? "inline" : "none")
                .attr("opacity", d => d.parent === root ? 1 : 0);

            // Add text
            const textElements = label.append("text")
                .style("font-size", "24px")
                .style("fill-opacity", d => d.parent === root ? 1 : 0)
                .style("display", d => d.parent === root ? "inline" : "none")
                .text(d => d.data.name);


            // Create the zoom behavior and zoom immediately in to the initial focus node.
            svg.on("click", (event) => zoom(event, root));
            let focus = root;
            let view;
            zoomTo([focus.x, focus.y, focus.r * 2]);

            function zoomTo(v) {
                const k = width / v[2];

                view = v;

                label.attr("transform", d => `translate(${(d.x - v[0]) * k},${(d.y - v[1]) * k})`);
                node.attr("transform", d => `translate(${(d.x - v[0]) * k},${(d.y - v[1]) * k})`);
                node.attr("r", d => d.r * k);
            }

            function zoom(event, d) {
                const focus0 = focus;

                focus = d;

                const transition = svg.transition()
                    .duration(event.altKey ? 7500 : 750)
                    .tween("zoom", d => {
                        const i = d3.interpolateZoom(view, [focus.x, focus.y, focus.r * 2]);
                        return t => zoomTo(i(t));
                    });

                label
                    .filter(function (d) { return d.parent === focus || d3.select(this).select("text").style("display") === "inline"; })
                    .transition(transition)
                    .each(function(d) {
                        const group = d3.select(this);
                        const text = group.select("text");
                        const rect = group.select("rect");
                        
                        text.style("fill-opacity", d.parent === focus ? 1 : 0)
                            .style("display", d.parent === focus ? "inline" : "none");
                        
                        rect.style("opacity", d.parent === focus ? 1 : 0)
                            .style("display", d.parent === focus ? "inline" : "none");
                    });
            }

            return svg.node();
        })();

        // Add the chart to the page
        document.getElementById('chart').appendChild(chart);

    </script>
</body>

</html>
