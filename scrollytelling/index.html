<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 Billion USD Heist</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap-trial@3.12.5/dist/ScrollSmoother.min.js"></script>
</head>

<body>

    <nav class="glass-header">
        <div class="nav-left">
            <a href="#" class="back-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
            </a>
            <img src="assets/logo.png" alt="Logo" class="nav-logo">
        </div>
        <div class="nav-center">
            <a href="#">politics</a>
            <a href="#">cybersecurity</a>
            <a href="#">tech</a>
        </div>
        <div class="nav-right">
            <button class="search-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
            </button>
        </div>
    </nav>

    <div id="smooth-wrapper">
        <div id="smooth-content">
            <header class="hero-section">
                <div class="hero-bg"></div>
                <div class="hero-content">
                    <h1>1 Billion USD Heist</h1>
                    <p>How hackers manipulated their way to a fortune</p>
                </div>
                <div class="scroll-indicator">
                    <span>Scroll</span>
                    <div class="arrow-down"></div>
                </div>
            </header>

            <div class="main-container">
                <div class="left-content" id="content-container">
                    <!-- Text sections will be injected here dynamically -->
                </div>

                <div class="right-content">
                    <div class="tablet-container">
                        <div class="tablet-frame">
                            <div class="tablet-screen">
                                <img alt="Tablet Content" id="tablet-image">
                                <div class="tablet-dash"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
